name: Release

on:
  release:
    types: [published]
  # Re-run only the HACS validation by hand.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: Check tag matches package.json
        run: |
          version="$(jq -r .version package.json)"
          # Tags are the bare version, without a "v" prefix (e.g. 0.1.0-beta.1).
          tag="$GITHUB_REF_NAME"
          if [ "$version" != "$tag" ]; then
            echo "::error::Release tag $GITHUB_REF_NAME does not match package.json version $version"
            exit 1
          fi
      - run: bun run lint
      - run: bun run check
      - run: bun test
      - run: bun run build
      # HACS downloads every .js asset of the release, so the lazy hls.js chunk ships too.
      - name: Attach bundle to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" dist/*.js --clobber

  # Runs after the assets are attached: HACS looks for camera-plus-card.js in the latest release.
  hacs:
    needs: release
    if: always() && (needs.release.result == 'success' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    steps:
      - uses: hacs/action@main
        with:
          category: plugin
          # README screenshots are only required for the HACS default store; drop this once they're added.
          ignore: images
